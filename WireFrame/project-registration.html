<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CET Finance Management Portal - Project Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="project-registration">
  <div id="appShell"></div>
  <main class="app-main">
    <div class="page-toolbar"><div><p class="eyebrow">Project Intake</p><h1>Project Registration</h1></div><div class="toolbar-actions"><button class="btn btn-outline-secondary">Cancel</button><button class="btn btn-outline-primary">Save Draft</button><button class="btn btn-primary">Submit</button></div></div>
    <section class="panel"><h2>Register Project</h2><form class="row g-3"><div class="col-md-4"><label class="form-label">Project Type</label><select class="form-select"><option>Jira Project</option><option>Non-Jira Project</option></select></div><div class="col-md-4"><label class="form-label">Project Name</label><input class="form-control" list="projectNames"><datalist id="projectNames"><option value="Core Banking Analytics"><option value="Invoice Automation"><option value="Risk Ledger Modernization"></datalist></div><div class="col-md-4"><label class="form-label">Jira ID</label><input class="form-control" placeholder="CET-2451"></div><div class="col-md-4"><label class="form-label">Business Unit</label><input class="form-control" list="businessUnits"><datalist id="businessUnits"><option value="Consumer Banking"><option value="Corporate Banking"><option value="Shared Services"></datalist></div><div class="col-md-4"><label class="form-label">Department</label><input class="form-control" value="CET"></div><div class="col-md-4"><label class="form-label">Project Manager</label><input class="form-control" list="people"><datalist id="people"><option value="Anika Rao"><option value="Marcus Lee"><option value="Sara Patel"><option value="Priya Menon"></datalist></div><div class="col-md-4"><label class="form-label">Project Owner</label><input class="form-control" list="people"></div><div class="col-md-4"><label class="form-label">CAPEX/OPEX</label><select class="form-select"><option>CAPEX</option><option>OPEX</option><option>Mixed</option></select></div><div class="col-md-4"><label class="form-label">Estimated Budget</label><input class="form-control" value="$750,000"></div><div class="col-md-4"><label class="form-label">Reviewer</label><input class="form-control" list="people"></div><div class="col-md-4"><label class="form-label">Approver</label><input class="form-control" list="people"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select"><option>Draft</option><option>Submitted</option><option>Approved</option><option>Rejected</option></select></div><div class="col-md-4"><label class="form-label">Start Date</label><input type="date" class="form-control" value="2026-08-01"></div><div class="col-md-4"><label class="form-label">End Date</label><input type="date" class="form-control" value="2027-03-31"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3">Modernize finance reporting and project spend visibility.</textarea></div></form></section>
    <section class="panel mt-4"><div class="section-title"><h2>Registered Projects</h2><div class="search-box compact"><i class="fa-solid fa-search"></i><input class="form-control table-search" data-table="projectTable" placeholder="Search projects"></div></div><div class="table-responsive"><table class="table table-hover align-middle data-table" id="projectTable"><thead><tr><th>Project</th><th>Type</th><th>Manager</th><th>Budget</th><th>CAPEX/OPEX</th><th>Status</th></tr></thead><tbody><tr><td>Core Banking Analytics</td><td>Jira</td><td>Anika Rao</td><td>$1.4M</td><td>CAPEX</td><td><span class="badge text-bg-success">Approved</span></td></tr><tr><td>Invoice Automation</td><td>Non-Jira</td><td>Sara Patel</td><td>$520K</td><td>OPEX</td><td><span class="badge text-bg-primary">Submitted</span></td></tr><tr><td>Risk Ledger Modernization</td><td>Jira</td><td>Marcus Lee</td><td>$920K</td><td>Mixed</td><td><span class="badge text-bg-warning">Review</span></td></tr></tbody></table></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script>
</body>
</html>
